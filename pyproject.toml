[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdchallenge"
version = "0.1.0"
description = "Predicting the true OFF MDS-UPDRS III motor score — ENS Challenge Data #159"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Modelling and analysis live behind extras so the core package stays importable with
# nothing but numpy/pandas — the feature layer in particular depends on neither.
models = ["scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "lightgbm>=4.5", "statsmodels>=0.14,<0.16"]
analysis = ["shap>=0.46"]
dev = ["pytest>=8", "mypy", "ruff"]

[project.scripts]
pdchallenge = "pdchallenge.cli:main"

[tool.setuptools.packages.find]
# `archive/` is deliberately excluded: it is frozen history, not part of the package.
include = ["pdchallenge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `addopts = "-q"` here: the command line already passes `-q`, and the two together
# (`-qq`) suppress the summary line. The `slow` marker is what the fast tier deselects on;
# `tests/conftest.py` applies it from `tests/slow_tests.txt`.
markers = [
    "slow: 读真实数据或耗时长；fast 层（-m \"not slow\"）不跑",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
